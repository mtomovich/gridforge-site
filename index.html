<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GridForge | Coming soon</title>
<meta name="description" content="GridForge. Coming soon.">
<meta name="theme-color" content="#07080a">
<style>
  :root { --bg:#07080a; --fg:#e8edf1; --dim:#7b858e; --tint:#3ad1ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }

  #stage { position:fixed; inset:0; }

  /* The bouncing logo */
  #logo { position:absolute; left:0; top:0; width:clamp(170px, 30vw, 360px);
    will-change:transform; transition:filter .15s linear;
    filter:drop-shadow(0 0 10px rgba(240,160,40,.55)) hue-rotate(var(--hue, 0deg)); }
  #logo svg, #logo .img { display:block; width:100%; height:auto; }
  #logo .mask { width:100%; background:currentColor;
    -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center; }


  /* Message */
  #msg { position:fixed; left:22px; bottom:max(18px, env(safe-area-inset-bottom)); z-index:3; max-width:min(560px, 70vw); }
  #msg h1 { font-size:clamp(28px, 5vw, 56px); line-height:1; letter-spacing:.02em; font-weight:600; }
  #msg p { font-size:clamp(16px, 2.1vw, 22px); color:var(--dim); margin-top:10px; line-height:1.25; letter-spacing:.03em; }
  #msg a { color:var(--fg); text-decoration:none; border-bottom:1px dashed var(--dim); pointer-events:auto; }
  #msg a:hover { border-bottom-color:var(--fg); }

  /* Corner celebration */
  #flash { position:fixed; inset:0; z-index:5; pointer-events:none; opacity:0; background:var(--tint); }
  #flash.on { animation:flash .9s ease-out; }
  #corner { position:fixed; inset:0; z-index:6; display:flex; align-items:center; justify-content:center; pointer-events:none;
    font-size:clamp(44px, 10vw, 140px); font-weight:700; letter-spacing:.04em; opacity:0; color:#fff; }
  #corner.on { animation:pop 2.2s ease-out; }
  .bit { position:fixed; width:8px; height:8px; z-index:6; pointer-events:none; }

  @keyframes flash { 0% { opacity:.55; } 100% { opacity:0; } }
  @keyframes pop { 0% { opacity:0; transform:scale(.6); } 12% { opacity:1; transform:scale(1.08); } 25% { transform:scale(1); } 80% { opacity:1; } 100% { opacity:0; } }

  @media (max-width:560px) {
      #msg { max-width:calc(100vw - 44px); }
  }
</style>
</head>

  <div id="msg">
    <h1>Coming soon</h1>
  </div>


  <div id="flash"></div>
  <div id="corner">CORNER!</div>

<script>
(() => {
  // ---- Settings ----------------------------------------------------------
  const SPEED = 140;          // pixels per second
  const COLORS = ["#3ad1ff", "#ff4fd8", "#ffd23a", "#5dff7a", "#ff7a3a", "#a98bff", "#ffffff"]; // confetti and flash
  const HUES = [0, 150, 200, 260, 300, 90, 330]; // logo color shifts; 0 is the brand orange
  // ------------------------------------------------------------------------

  const logo = document.getElementById("logo");
  const flash = document.getElementById("flash");
  const corner = document.getElementById("corner");


  let W, H, w, h;
  function measure() {
    W = innerWidth; H = innerHeight;
    const r = logo.getBoundingClientRect(); w = r.width; h = r.height;
    x = Math.min(Math.max(0, x), Math.max(0, W - w));
    y = Math.min(Math.max(0, y), Math.max(0, H - h));
  }

  let x = Math.random() * (innerWidth * 0.5), y = Math.random() * (innerHeight * 0.5);
  let vx = SPEED * (Math.random() < .5 ? -1 : 1), vy = SPEED * 0.75 * (Math.random() < .5 ? -1 : 1);
  let color = 0;
  measure();

  function recolor() {
    let n; do { n = Math.floor(Math.random() * HUES.length); } while (n === color);
    color = n;
    logo.style.setProperty("--hue", HUES[n] + "deg");
    document.documentElement.style.setProperty("--tint", COLORS[n]);
  }
  logo.querySelector("img").addEventListener("load", measure);

  function celebrate() {
    flash.classList.remove("on"); corner.classList.remove("on");
    void flash.offsetWidth;
    flash.classList.add("on"); corner.classList.add("on");
    const cx = x + w / 2, cy = y + h / 2;
    for (let i = 0; i < 60; i++) {
      const b = document.createElement("div");
      b.className = "bit";
      b.style.background = COLORS[i % COLORS.length];
      b.style.left = cx + "px"; b.style.top = cy + "px";
      document.body.appendChild(b);
      const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * Math.max(W, H) * 0.5;
      b.animate([
        { transform: "translate(0,0) rotate(0)", opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], { duration: 1400 + Math.random() * 800, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => b.remove();
    }
  }

  let last = performance.now(), start = last;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    x += vx * dt; y += vy * dt;
    let bx = false, by = false;
    const maxX = W - w, maxY = H - h;
    if (x <= 0) { x = -x; vx = Math.abs(vx); bx = true; }
    else if (x >= maxX) { x = 2 * maxX - x; vx = -Math.abs(vx); bx = true; }
    if (y <= 0) { y = -y; vy = Math.abs(vy); by = true; }
    else if (y >= maxY) { y = 2 * maxY - y; vy = -Math.abs(vy); by = true; }

    if (bx || by) {
      recolor();
      // Distance from the other wall at the moment of this bounce
      const dx = Math.min(x, maxX - x), dy = Math.min(y, maxY - y);
      const off = bx ? dy : dx;
      if ((bx && by) || off <= 2) celebrate();
    }

    logo.style.transform = `translate3d(${x}px, ${y}px, 0)`;

    requestAnimationFrame(frame);
  }

  addEventListener("resize", measure);
  requestAnimationFrame(frame);
})();
</script>
